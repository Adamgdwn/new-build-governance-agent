project_name: example-project
project_type: application
use_case:
  primary: Web application / SaaS
  secondary: []
  notes: Use-case classification informs controls but does not override selected risk_tier or governance_level.
risk_tier: medium
governance_level: 2
repository_model: single-repo
owner:
  name: Project Owner
  role: owner
technical_lead:
  name: Technical Lead
  role: technical-lead
status: active
environments:
  - dev
  - staging
  - prod
data_classification:
  handles_sensitive_data: false
  handles_money: false
  notes: ""
controls:
  required_docs:
    - README.md
    - START_HERE.md
    - docs/context-map.md
    - docs/architecture.md
    - docs/current-build-pathway.md
    - docs/manual.md
    - docs/roadmap.md
    - docs/policy/durable-development-engineering-policy.md
    - docs/standards/README.md
    - docs/standards/code-complexity-control-standard.md
    - docs/standards/engineering-governance-by-use-case.md
    - docs/standards/governance-source-alignment-standard.md
    - docs/standards/ship-ready-engineering-standard.md
    - docs/deployment-guide.md
    - docs/runbook.md
    - docs/CHANGELOG.md
    - docs/risks/risk-register.md
  machine_enforcement:
    - required-file-check
    - lint
    - tests
    - secret-scan
quality_controls:
  cyclomatic_complexity:
    mode: advisory
    review_above: 10
    refactor_or_exception_above: 20
    scope: changed-code
governance_alignment:
  source: New Build Governance Agent
  mode: review-before-apply
  review_cadence_days: 90
  last_reviewed: ""
exceptions: []
agent_controls:
  # Governs this project's runtime AI system. Set applicable: true when the
  # product itself uses AI (inference calls, agent loops, model-backed features).
  # Separate from agentic_coding below, which governs development-time coding agents only.
  applicable: false
  autonomy_level: A0
  harness_profile: none
  harness_manifest: ""
  activation_mode: build_only
  model_registry: []
  prompt_registry: []
agentic_coding:
  # Governs coding agent behavior in this repository (development-time only).
  # This section does not authorize runtime AI calls in the built product.
  principle: "The repository remembers. Agents rent context."
  default_budget: medium
  always_loaded_files:
    - AGENTS.md
  conditional_loaded_files:
    START_HERE.md: material work, unclear scope, handoffs, or active-plan changes
    docs/context-map.md: unclear context routing or broader task scoping
    project-control.yaml: risk, governance level, controls, or required docs
  context_limits:
    # AGENTS.md is the single canonical instruction file (about 600 words); CLAUDE.md is the one-line import `@AGENTS.md`.
    agents_md_target_kb: 4
    claude_md_target_kb: 1
    task_packet_target_words: 1200
    handoff_target_words: 900
  subagent_policy:
    max_parallel_readers: 3
    max_parallel_editors: 1
    require_summary_only: true
    no_overlapping_file_edits: true
