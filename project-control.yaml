project_name: new-build-governance-agent
project_type: agent
use_case:
  primary: AI agent with tools
  secondary:
    - Infrastructure / deployment code
  notes: Governance framework and scaffolding automation for governed builds. Use-case classification informs controls but does not override selected risk_tier or governance_level.
risk_tier: high
governance_level: 3
repository_model: single-repo
owner:
  name: Adam Goodwin
  role: owner
technical_lead:
  name: codex session
  role: technical-lead
status: active
environments:
  - dev
  - staging
  - prod
data_classification:
  handles_sensitive_data: false
  handles_money: false
  notes: ""
controls:
  required_docs:
    - README.md
    - START_HERE.md
    - docs/context-map.md
    - docs/architecture.md
    - docs/current-build-pathway.md
    - docs/manual.md
    - docs/roadmap.md
    - docs/policy/durable-development-engineering-policy.md
    - docs/standards/README.md
    - docs/standards/engineering-governance-by-use-case.md
    - docs/standards/ship-ready-engineering-standard.md
    - docs/deployment-guide.md
    - docs/runbook.md
    - docs/CHANGELOG.md
    - docs/risks/risk-register.md
  machine_enforcement:
    # All four are enforced by scripts/validate.sh and scripts/validate.ps1, run
    # identically in local development and CI (.github/workflows/validate.yml):
    #   required-file-check -> required-files list + schema validation steps
    #   lint -> ruff check, ruff format --check, mypy, shellcheck, PSScriptAnalyzer
    #   tests -> unittest suite with coverage floor
    #   secret-scan -> tests/test_secret_hygiene.py committed-secret scan step
    - required-file-check
    - lint
    - tests
    - secret-scan
exceptions: []
agent_controls:
  applicable: true
  autonomy_level: A1
  model_registry: []
  prompt_registry: []
agentic_coding:
  principle: "The repository remembers. Agents rent context."
  default_budget: medium
  always_loaded_files:
    - AGENTS.md
  conditional_loaded_files:
    START_HERE.md: material work, unclear scope, handoffs, or active-plan changes
    docs/context-map.md: unclear context routing or broader task scoping
    project-control.yaml: risk, governance level, controls, or required docs
  context_limits:
    agents_md_target_kb: 6
    claude_md_target_kb: 6
    task_packet_target_words: 1200
    handoff_target_words: 900
  subagent_policy:
    max_parallel_readers: 3
    max_parallel_editors: 1
    require_summary_only: true
    no_overlapping_file_edits: true
